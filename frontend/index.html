<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      const EXTENSION_ERROR_PATTERNS = [
        'a listener indicated an asynchronous response',
        'message channel closed',
        'runtime.lasterror',
        'message channel closed before a response was received',
        'the message channel closed',
        'could not establish connection. receiving end does not exist',
        'unchecked runtime.lasterror'
      ];

      const isExtensionError = (...args) => {
        if (!args || args.length === 0) return false;
        return args.some(arg => {
          if (!arg) return false;
          let str = '';
          if (typeof arg === 'string') {
            str = arg;
          } else if (arg instanceof Error) {
            str = `${arg.name || ''} ${arg.message || ''} ${arg.stack || ''}`;
          } else if (typeof arg === 'object') {
            str = `${arg.message || ''} ${arg.reason || ''} ${arg.error?.message || ''} ${arg.detail || ''} ${String(arg)}`;
          } else {
            str = String(arg);
          }
          const lower = str.toLowerCase();
          return EXTENSION_ERROR_PATTERNS.some(pat => lower.includes(pat));
        });
      };

      // Patch window.chrome.runtime to safely absorb dangling message ports
      const patchRuntime = (runtime) => {
        if (!runtime || typeof runtime !== 'object') return;

        // 1. Wrap sendMessage
        if (typeof runtime.sendMessage === 'function' && !runtime._sendMessagePatched) {
          const origSend = runtime.sendMessage.bind(runtime);
          runtime.sendMessage = function (...args) {
            try {
              const lastArg = args[args.length - 1];
              if (typeof lastArg === 'function') {
                args[args.length - 1] = function (...cbArgs) {
                  try { void runtime.lastError; } catch (_) {}
                  return lastArg.apply(this, cbArgs);
                };
                return origSend(...args);
              }
              const p = origSend(...args);
              if (p && typeof p.then === 'function') {
                return p
                  .then(res => {
                    try { void runtime.lastError; } catch (_) {}
                    return res;
                  })
                  .catch(err => {
                    try { void runtime.lastError; } catch (_) {}
                    if (isExtensionError(err)) return undefined;
                    throw err;
                  });
              }
              return p;
            } catch (err) {
              try { void runtime.lastError; } catch (_) {}
              if (isExtensionError(err)) return Promise.resolve(undefined);
              throw err;
            }
          };
          runtime._sendMessagePatched = true;
        }

        // 2. Wrap onMessage.addListener
        if (runtime.onMessage && typeof runtime.onMessage.addListener === 'function' && !runtime._addListenerPatched) {
          const origAdd = runtime.onMessage.addListener.bind(runtime.onMessage);
          runtime.onMessage.addListener = function (listener) {
            if (typeof listener !== 'function') return origAdd(listener);
            return origAdd(function (message, sender, sendResponse) {
              let responded = false;
              const safeSendResponse = function (...respArgs) {
                if (responded) return;
                responded = true;
                try {
                  sendResponse(...respArgs);
                } catch (_) {}
              };

              try {
                const res = listener(message, sender, safeSendResponse);
                if (res === true) {
                  // Safety timer to close channel gracefully if listener never responds
                  setTimeout(() => {
                    if (!responded) safeSendResponse({ status: 'auto_resolved' });
                  }, 3000);
                  return true;
                }
                return res;
              } catch (e) {
                safeSendResponse({ error: String(e) });
                return false;
              }
            });
          };
          runtime._addListenerPatched = true;
        }
      };

      const checkRuntimeLastError = () => {
        try {
          if (typeof window !== 'undefined' && window.chrome?.runtime) {
            void window.chrome.runtime.lastError;
          }
        } catch (_) {}
      };

      // Watch and auto-patch window.chrome if injected by extensions
      try {
        let _chrome = window.chrome;
        if (_chrome) patchRuntime(_chrome.runtime);

        Object.defineProperty(window, 'chrome', {
          configurable: true,
          enumerable: true,
          get() { return _chrome; },
          set(val) {
            _chrome = val;
            if (_chrome) patchRuntime(_chrome.runtime);
          }
        });
      } catch (_) {}

      // Intercept console.error & console.warn
      const origConsoleError = console.error;
      console.error = function (...args) {
        if (isExtensionError(...args)) {
          checkRuntimeLastError();
          return;
        }
        return origConsoleError.apply(console, args);
      };

      const origConsoleWarn = console.warn;
      console.warn = function (...args) {
        if (isExtensionError(...args)) {
          checkRuntimeLastError();
          return;
        }
        return origConsoleWarn.apply(console, args);
      };

      // Intercept unhandled promise rejections
      const handleRejection = function (e) {
        if (!e) return;
        const reason = e.reason || e;
        if (isExtensionError(reason, e.message, e)) {
          try {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            if (typeof e.stopPropagation === 'function') e.stopPropagation();
          } catch (_) {}
          checkRuntimeLastError();
          return true;
        }
      };

      window.addEventListener('unhandledrejection', handleRejection, { capture: true, passive: false });
      window.addEventListener('unhandledrejection', handleRejection, false);

      const origOnUnhandledRejection = window.onunhandledrejection;
      window.onunhandledrejection = function (e) {
        if (handleRejection(e)) return true;
        if (typeof origOnUnhandledRejection === 'function') {
          return origOnUnhandledRejection.apply(this, arguments);
        }
      };

      // Intercept global errors
      const handleError = function (e) {
        if (!e) return;
        const err = e.error || e;
        if (isExtensionError(err, e.message, e.filename, e)) {
          try {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            if (typeof e.stopPropagation === 'function') e.stopPropagation();
          } catch (_) {}
          checkRuntimeLastError();
          return true;
        }
      };

      window.addEventListener('error', handleError, { capture: true, passive: false });
      window.addEventListener('error', handleError, false);

      const origOnError = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        if (isExtensionError(message, source, error)) {
          checkRuntimeLastError();
          return true;
        }
        if (typeof origOnError === 'function') {
          return origOnError.apply(this, arguments);
        }
      };
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Enterprise-level Admin Panel for the MAM Platform. Super Admin and District Admin dashboards, agents and pincode assignment, wallet withdrawals, commission setups, and reporting." />
  <title>CONNECT APP ADMIN</title>
</head>
