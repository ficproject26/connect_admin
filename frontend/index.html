<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      const isExtensionError = (...args) => {
        if (!args || args.length === 0) return false;
        return args.some(arg => {
          if (!arg) return false;
          let str = '';
          if (typeof arg === 'string') {
            str = arg;
          } else if (arg instanceof Error) {
            str = `${arg.name || ''} ${arg.message || ''} ${arg.stack || ''}`;
          } else if (typeof arg === 'object') {
            str = `${arg.message || ''} ${arg.reason || ''} ${arg.error?.message || ''} ${arg.detail || ''} ${String(arg)}`;
          } else {
            str = String(arg);
          }
          const lower = str.toLowerCase();
          return (
            lower.includes('a listener indicated an asynchronous response') ||
            lower.includes('message channel closed') ||
            lower.includes('runtime.lasterror') ||
            lower.includes('message channel closed before a response was received')
          );
        });
      };

      const checkRuntimeLastError = () => {
        try {
          if (typeof window !== 'undefined' && window.chrome?.runtime) {
            void window.chrome.runtime.lastError;
          }
        } catch (e) {}
      };

      const origConsoleError = console.error;
      console.error = function (...args) {
        if (isExtensionError(...args)) {
          checkRuntimeLastError();
          return;
        }
        return origConsoleError.apply(console, args);
      };

      const origConsoleWarn = console.warn;
      console.warn = function (...args) {
        if (isExtensionError(...args)) {
          checkRuntimeLastError();
          return;
        }
        return origConsoleWarn.apply(console, args);
      };

      const handleRejection = function (e) {
        if (isExtensionError(e?.reason, e?.message, e)) {
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          checkRuntimeLastError();
          return true;
        }
      };

      window.addEventListener('unhandledrejection', handleRejection, true);
      window.addEventListener('unhandledrejection', handleRejection, false);

      const origOnUnhandledRejection = window.onunhandledrejection;
      window.onunhandledrejection = function (e) {
        if (handleRejection(e)) return true;
        if (typeof origOnUnhandledRejection === 'function') {
          return origOnUnhandledRejection.apply(this, arguments);
        }
      };

      const handleError = function (e) {
        if (isExtensionError(e?.error, e?.message, e?.filename, e)) {
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          checkRuntimeLastError();
          return true;
        }
      };

      window.addEventListener('error', handleError, true);
      window.addEventListener('error', handleError, false);

      const origOnError = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        if (isExtensionError(message, source, error)) {
          checkRuntimeLastError();
          return true;
        }
        if (typeof origOnError === 'function') {
          return origOnError.apply(this, arguments);
        }
      };
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Enterprise-level Admin Panel for the MAM Platform. Super Admin and District Admin dashboards, agents and pincode assignment, wallet withdrawals, commission setups, and reporting." />
  <title>CONNECT APP ADMIN</title>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
